name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test core policies
        run: pnpm --filter @schoolos/core test

      - name: Test database tenant isolation
        run: pnpm --filter @schoolos/db test

      - name: Test web services
        run: pnpm --filter @schoolos/web test

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint web application
        run: pnpm --filter @schoolos/web lint

      - name: Build web application
        run: pnpm --filter @schoolos/web build
        env:
          # Dummy values so the build can prerender; no real services are contacted.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          MONGODB_URI: mongodb://localhost:27017/schoolos-build
